<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Focusa Workforce — Wall</title>
  <link rel="stylesheet" href="wall.css">
</head>
<!--
  docs/17 §16 Wall — dedicated tab, read only, "understand the room at a glance".
  Region order is fixed by the atlas: header/brand + Fresh → CURRENT FOCUS →
  WORKING NOW | NEEDS YOU | VERIFIED RECENTLY → EXCEPTION only if material.
  READ ONLY: the wall renders owner projections and has no mutation authority.
-->
<body>
  <main class="wall" aria-label="Focusa Workforce wall">
    <header class="wall-header">
      <div class="wall-brand">
        <span class="mark" aria-hidden="true">F</span>
        <div>
          <p class="wall-label">Focusa Workforce</p>
          <p id="source" class="wall-source">— no environment</p>
        </div>
      </div>
      <p class="wall-readonly">READ ONLY · no mutation authority</p>
      <span id="freshness" class="wall-fresh">Unavailable</span>
    </header>

    <!-- CURRENT FOCUS (28–32px title) -->
    <section class="wall-focus" aria-labelledby="wall-focus-heading">
      <p class="wall-label">Current Focus</p>
      <h1 id="wall-focus-heading" class="wall-focus-title">— no current focus reported</h1>
      <p id="task" class="wall-focus-task">—</p>
      <p id="loop-state" class="wall-focus-meta">—</p>
    </section>

    <div class="wall-cols">
      <section class="wall-col" aria-labelledby="wall-working-heading">
        <div class="wall-col-head"><h2 id="wall-working-heading">Working Now</h2><span id="working-count" class="wall-count">0</span></div>
        <ul id="signals" class="wall-list"><li class="wall-empty">No active work reported.</li></ul>
      </section>

      <section class="wall-col" aria-labelledby="wall-needs-heading">
        <div class="wall-col-head"><h2 id="wall-needs-heading">Needs You</h2><span id="needs-count" class="wall-count">0</span></div>
        <ul id="wall-needs" class="wall-list"><li class="wall-empty">Nothing needs you right now.</li></ul>
      </section>

      <section class="wall-col" aria-labelledby="wall-verified-heading">
        <div class="wall-col-head"><h2 id="wall-verified-heading">Verified Recently</h2><span id="verified-count" class="wall-count">0</span></div>
        <ul id="wall-verified" class="wall-list"><li class="wall-empty">No settled proof yet.</li></ul>
      </section>
    </div>

    <!-- EXCEPTION: only when material (browser auth / capacity / outage) -->
    <section id="wall-exception" class="wall-exception" aria-labelledby="wall-exception-heading" hidden>
      <div class="wall-col-head"><h2 id="wall-exception-heading">Exception</h2></div>
      <p id="wall-exception-text" class="wall-exception-text"></p>
    </section>

    <footer class="wall-footer">
      <span id="stream-state" class="wall-meta">stream idle</span>
      <button id="open-workforce" type="button" class="wall-btn">Open Workforce</button>
    </footer>
  </main>
  <script type="module" src="wall.mjs"></script>
</body>
</html>
